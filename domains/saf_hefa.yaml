# domains/saf_hefa.yaml
#
# Sustainable Aviation Fuel via the HEFA pathway (waste cooking oil ->
# catalytic hydroprocessing -> jet-range SPK). Spans the full causal chain:
#   feedstock -> catalyst structure -> reaction conditions ->
#   deoxygenation/upgrading pathway -> product distribution -> SAF properties
#
# multi_experiment: true — many papers compare several catalysts (or the same
# catalyst at several conditions) in one table. One flat record per paper
# loses all but one row. Setting multi_experiment: true instructs the LLM to
# produce one ExperimentFields record per distinct catalyst/condition
# combination and the pipeline to write one DataFrame row per experiment.
# Unit of analysis for ML is the experiment, not the paper.
#
# Fields are tagged:
#   scope: paper       — constant for all experiments in the paper
#                        (feedstock properties, bibliographic-style facts)
#   scope: experiment  — can differ per catalyst/condition row
#                        (catalyst identity, conditions, outcomes, SAF props)

domain_name: saf_hefa
description: >
  Feedstock quality, catalyst structure, hydroprocessing conditions,
  deoxygenation/upgrading pathway, product distribution, and finished-SAF
  property data from the HEFA literature on waste cooking oil conversion to
  jet-range SPK. multi_experiment=true: one record per catalyst/condition
  combination, not one per paper.
prompt_template_path: "../prompts/saf_hefa.txt"
multi_experiment: true
extract_claims: true
min_experiments: 1
max_experiments: 30

# The minimal structure/characterization (features) + reaction-condition +
# performance (target) fields a shallow-ML structure-property-performance
# model needs non-null to make a usable training row. Purely advisory to
# normalize.py (see DomainSpec.ml_core_fields docstring) -- these fields
# remain individually optional/nullable at extraction time; this list only
# drives a downstream ml_core_features_complete convenience column.
# Deliberately excludes deep characterization fields (TPR peaks, CO2-TPD,
# kinetics) that are reported for only a minority of papers -- requiring
# those here would mark nearly every row incomplete and make the flag
# useless. active_metal/support_type/metal_loading_wt_pct + reaction
# conditions + oil_conversion_pct is the realistic minimum most papers
# actually report and that a first structure-activity model would use.
ml_core_fields:
  - active_metal
  - support_type
  - metal_loading_wt_pct
  - reaction_temperature_C
  - reaction_pressure_bar
  - oil_conversion_pct

fields:
  # ── PAPER-SCOPE: constant across all experiments in the paper ──────────
  - name: feedstock_type
    scope: paper
    type: str
    description: Lipid feedstock used in the paper
    unit: categorical
    enum: [waste_cooking_oil, used_cooking_oil, tallow_animal_fat, palm_oil,
           non_edible_vegetable_oil, algae_oil, brown_grease, mixed_waste_lipid,
           other, not_specified]
    required: true

  - name: ffa_content_pct
    scope: paper
    type: float
    description: Free fatty acid content of the feedstock
    unit: "wt%"

  - name: moisture_content_pct
    scope: paper
    type: float
    description: Moisture content of the feedstock
    unit: "wt%"

  - name: acid_value_mgKOHg
    scope: paper
    type: float
    description: Acid value of the feedstock
    unit: "mg KOH/g"

  - name: iodine_value
    scope: paper
    type: float
    description: Iodine value (degree of unsaturation)
    unit: "g I2/100g"

  - name: dominant_fatty_acid_chain
    scope: paper
    type: str
    description: >
      Dominant fatty-acid carbon-chain range reported for the feedstock
      (free text, e.g. "C16-C18"). Null if not reported.
    unit: "-"

  - name: feedstock_sulfur_ppm
    scope: paper
    type: float
    description: Sulfur content of the feedstock (catalyst-poison relevant)
    unit: "ppm"

  # ── EXPERIMENT-SCOPE: one record per catalyst / condition combination ──
  - name: active_metal
    scope: experiment
    type: str
    emphasize: true
    description: >
      Active metal(s)/alloy exactly as the authors wrote it, ISOLATED from
      support and loading (e.g. "NiMo" or "Pt", not "10% NiMo/Al2O3" or
      "10 wt% Pt"). Support goes in support_material, loading goes in
      metal_loading_wt_pct -- do not fold either into this field. Do not
      expand trade names or invent oxidation states.
    unit: "-"
    required: true

  - name: support_material
    scope: experiment
    type: str
    description: >
      Support material exactly as written, e.g. "gamma-Al2O3", "HZSM-5",
      "SAPO-11", "activated_carbon". Canonical form added post-extraction.
    unit: "-"

  - name: support_type
    scope: experiment
    type: str
    emphasize: true
    description: >
      Structural class of the support, classified from support_material.
      Set from the support's known family: HZSM-5/H-Beta/SAPO-n/MFI-type
      frameworks -> zeolite; SBA-n/MCM-n/KIT-n -> mesoporous_silica;
      Al2O3/TiO2/SiO2/CeO2/ZrO2/MgO single-component oxides -> metal_oxide;
      two-or-more-oxide combinations (e.g. CeO2-ZrO2, Al2O3-SiO2) ->
      mixed_metal_oxide; activated_carbon/CNT/graphene/graphitic carbon ->
      activated_carbon; UiO-n/ZIF-n/MIL-n framework names -> MOF;
      layered-double-hydroxide-derived supports -> hydrotalcite_derived.
      Use not_specified only if support_material itself is null; use other
      if support_material is given but doesn't fit any class above.
    unit: categorical
    enum: [zeolite, mesoporous_silica, metal_oxide, mixed_metal_oxide,
           activated_carbon, MOF, hydrotalcite_derived, other, not_specified]

  - name: promoter
    scope: experiment
    type: str
    description: Promoter element/oxide if reported (null if none reported)
    unit: "-"

  - name: promoter_loading_wt_pct
    scope: experiment
    type: float
    emphasize: true
    description: >
      Promoter loading relative to support or total catalyst mass, exactly
      as basis is reported. Null if no promoter is reported, even if
      promoter identity itself is also null.
    unit: "wt%"

  - name: metal_loading_wt_pct
    scope: experiment
    type: float
    description: Active metal loading relative to support
    unit: "wt%"

  - name: synthesis_method
    scope: experiment
    type: str
    description: >
      Catalyst preparation route, from the paper's Experimental/Synthesis/
      Preparation section. incipient_wetness_impregnation is by far the
      most common in HEFA catalyst papers -- do not default to it if the
      method isn't actually described; use not_specified instead.
    unit: categorical
    enum: [incipient_wetness_impregnation, co_impregnation,
           sequential_impregnation, co_precipitation, sol_gel,
           deposition_precipitation, hydrothermal_synthesis, ion_exchange,
           physical_mixing, flame_spray_pyrolysis, other, not_specified]

  - name: calcination_temperature_C
    scope: experiment
    type: float
    description: Calcination temperature after synthesis, before reduction/reaction
    unit: "°C"

  - name: calcination_time_h
    scope: experiment
    type: float
    description: Calcination hold time
    unit: "h"

  - name: calcination_atmosphere
    scope: experiment
    type: str
    description: Atmosphere during calcination
    unit: categorical
    enum: [static_air, flowing_air, N2, O2, other, not_specified]

  - name: reduction_temperature_C
    scope: experiment
    type: float
    description: >
      Pre-reaction reduction/activation temperature (typically under H2 or
      H2/inert flow), reported separately from the reaction temperature
      itself. Do not confuse with reaction_temperature_C below.
    unit: "°C"

  - name: reduction_time_h
    scope: experiment
    type: float
    description: Pre-reaction reduction/activation hold time
    unit: "h"

  - name: bet_surface_area_m2g
    scope: experiment
    type: float
    description: BET surface area of the fresh catalyst
    unit: "m²/g"

  - name: average_pore_diameter_nm
    scope: experiment
    type: float
    description: Average pore diameter (BJH/BET)
    unit: "nm"

  - name: metal_dispersion_pct
    scope: experiment
    type: float
    description: Metal dispersion from H2/CO chemisorption
    unit: "%"

  - name: metal_particle_size_nm
    scope: experiment
    type: float
    description: Average metal particle/crystallite size
    unit: "nm"

  - name: particle_size_method
    scope: experiment
    type: str
    description: >
      Technique the metal_particle_size_nm value came from. TEM and
      XRD-Scherrer routinely disagree for the same catalyst (different
      averaging, different sensitivity to small particles) -- recording
      which method produced the value is necessary to compare particle
      sizes across papers correctly. Set both only if the paper reports
      values from both methods and metal_particle_size_nm above is itself
      an average of the two as stated by the authors.
    unit: categorical
    enum: [TEM, XRD_Scherrer, both, not_specified]

  - name: acidity_type
    scope: experiment
    type: str
    description: Dominant acid site type (from NH3-TPD, pyridine-FTIR, etc.)
    unit: categorical
    enum: [bronsted, lewis, both, none, not_specified]

  - name: nh3_uptake_mmol_g
    scope: experiment
    type: float
    description: Total acid site density from NH3-TPD
    unit: "mmol/g"

  - name: reducibility_temp_C
    scope: experiment
    type: float
    description: >
      Peak reduction temperature from H2-TPR (proxy for metal-support
      interaction strength). If the paper reports a SINGLE reduction peak,
      use this field. If it distinguishes two peaks (a common pattern for
      NiMo/Al2O3-type catalysts: a lower-temperature peak for easily
      reducible, weakly-bound surface/octahedral species and a higher-
      temperature peak for bulk/tetrahedral species strongly interacting
      with the support), set tpr_peak_low_C and tpr_peak_high_C below
      instead, and set this field to whichever peak the authors describe
      as dominant (usually the higher-intensity one) if they single one
      out -- otherwise leave this null rather than picking arbitrarily.
    unit: "°C"

  - name: tpr_peak_low_C
    scope: experiment
    type: float
    description: >
      Lower-temperature H2-TPR reduction peak, when the paper reports two
      (or more, in which case record the lowest) distinct peaks rather
      than a single reduction temperature. Typically assigned to weakly-
      bound, easily reducible surface metal-oxide species. Null if the
      paper reports only one undifferentiated reduction temperature (use
      reducibility_temp_C for that case instead).
    unit: "°C"

  - name: tpr_peak_high_C
    scope: experiment
    type: float
    description: >
      Higher-temperature H2-TPR reduction peak, when the paper reports two
      (or more, in which case record the highest) distinct peaks. Typically
      assigned to bulk metal-oxide species or species in strong interaction
      with the support (e.g. nickel/cobalt aluminate-like phases). Null if
      the paper reports only one undifferentiated reduction temperature.
    unit: "°C"

  - name: co2_uptake_mmol_g
    scope: experiment
    type: float
    description: >
      Total basic site density from CO2-TPD, when reported. Basicity
      (alongside acidity from NH3-TPD, see nh3_uptake_mmol_g) affects
      triglyceride/FFA adsorption and is reported for a meaningful minority
      of HEFA catalyst characterization studies -- null if CO2-TPD is not
      performed or not reported, do not infer from acidity data.
    unit: "mmol/g"

  - name: catalyst_type
    scope: experiment
    type: str
    description: >
      Structural classification of the catalyst material itself (distinct
      from support_type, which classifies the SUPPORT). supported_metal:
      metal/metal-oxide active phase dispersed on a separate support
      (the overwhelming majority of HEFA hydroprocessing catalysts).
      bulk_metal: unsupported metal or metal-oxide catalyst with no
      distinct support phase. bifunctional_catalyst: paper explicitly
      frames the catalyst as combining a hydrogenation function (metal)
      and an acid function (e.g. zeolite/SAPO) for isomerization/cracking
      in the same material, not merely "metal on an acidic support" as an
      incidental description -- only use this value if the paper itself
      uses bifunctional framing, not as a default for any zeolite-
      supported metal.
    unit: categorical
    enum: [supported_metal, bulk_metal, bifunctional_catalyst, other, not_specified]

  - name: reaction_temperature_C
    scope: experiment
    type: float
    description: Hydroprocessing temperature
    unit: "°C"
    required: true

  - name: reaction_pressure_bar
    scope: experiment
    type: float
    description: H2 pressure
    unit: "bar"

  - name: h2_to_oil_ratio_NL_L
    scope: experiment
    type: float
    description: H2-to-oil feed ratio
    unit: "NL H2 / L oil"

  - name: lhsv_h
    scope: experiment
    type: float
    description: Liquid hourly space velocity
    unit: "h⁻¹"

  - name: whsv_h
    scope: experiment
    type: float
    description: Weight hourly space velocity
    unit: "h⁻¹"

  - name: reactor_type
    scope: experiment
    type: str
    description: Reactor configuration
    unit: categorical
    enum: [fixed_bed_continuous, trickle_bed, batch_autoclave,
           continuous_stirred_tank, not_specified]

  - name: deoxygenation_pathway
    scope: experiment
    type: str
    description: >
      Dominant deoxygenation route. HDO=hydrodeoxygenation (-H2O, chain
      retained). DCO=decarbonylation (-CO, chain shortened). DCO2=
      decarboxylation (-CO2). mixed_HDO_DC=both. Infer from gas-phase
      byproducts (H2O/CO/CO2) or chain-length shift if not stated.
    unit: categorical
    enum: [HDO, DCO, DCO2, mixed_HDO_DC, not_specified]

  - name: downstream_processing
    scope: experiment
    type: str
    description: >
      Upgrading step after deoxygenation. hydroisomerization=skeletal
      branching. hydrocracking=chain scission. Set none only if straight-chain
      n-paraffin product with no further processing is explicitly described.
    unit: categorical
    enum: [hydroisomerization, hydrocracking, hydroisomerization_and_cracking,
           none, not_specified]

  - name: deoxygenation_degree_pct
    scope: experiment
    type: float
    description: Fraction of feedstock oxygen removed
    unit: "%"

  - name: oil_conversion_pct
    scope: experiment
    type: float
    description: >
      Feedstock (triglyceride/FFA) conversion. NOT required: some papers
      report only yield or selectivity for a given experiment without an
      explicit conversion number (e.g. a screening-table row marked "n.d."
      or reporting only product yield) -- treating this as mandatory would
      fail validation for the entire experiment list over one missing
      value in one row, losing an otherwise fully extractable paper.
    unit: "%"

  - name: iso_to_normal_paraffin_ratio
    scope: experiment
    type: float
    description: Iso-to-normal paraffin ratio in the liquid product
    unit: "ratio"

  - name: c8_c16_jet_range_selectivity_pct
    scope: experiment
    type: float
    description: Selectivity to C8-C16 jet-boiling-range hydrocarbons
    unit: "%"

  - name: residual_oxygenate_content_pct
    scope: experiment
    type: float
    description: Residual oxygen-containing compounds in liquid product
    unit: "%"

  - name: jet_fraction_yield_pct
    scope: experiment
    type: float
    description: Yield of distilled jet-range cut relative to feedstock mass
    unit: "wt%"

  - name: tof_h
    scope: experiment
    type: float
    description: >
      Turnover frequency if reported. Record the numeric value only; report
      the basis (total_metal / accessible_metal / BET / mass) in
      evidence_text of the EvidenceSpan for this experiment.
    unit: "h⁻¹"

  - name: activation_energy_kJ_mol
    scope: experiment
    type: float
    description: Apparent activation energy if reported (Arrhenius analysis)
    unit: "kJ/mol"

  - name: kinetic_model
    scope: experiment
    type: str
    description: >
      The kinetic rate model the paper actually fits to its data, if any
      quantitative kinetic analysis (rate constant, reaction order, or
      Arrhenius parameters) is reported at all. pseudo_first_order: rate
      expressed as first-order in a single reactant concentration (by far
      the most common simplification in HEFA/hydroprocessing kinetics).
      power_law: rate = k * [reactant]^n with an explicitly fitted
      non-unity order n. LHHW (Langmuir-Hinshelwood-Hougen-Watson):
      explicit adsorption-term denominator in the rate expression -- only
      use this if the paper's rate equation itself has that form, not
      merely because adsorption is discussed qualitatively. Set
      not_specified if no quantitative kinetic model is fitted at all
      (most papers only report conversion/selectivity with no rate law --
      that is the common case, not an extraction failure).
    unit: categorical
    enum: [pseudo_first_order, pseudo_second_order, power_law, LHHW, other, not_specified]

  - name: rate_constant
    scope: experiment
    type: float
    description: >
      Numeric value of the fitted rate constant k, exactly as reported
      (whatever basis/units the paper uses -- record the actual unit
      string in rate_constant_unit_reported, since the basis varies
      widely: min^-1, h^-1, mol/(g_cat*h), L/(mol*h), etc. and is NOT
      standardized across this literature the way TOF's h^-1 basis is).
      Null if kinetic_model is not_specified.
    unit: "varies -- see rate_constant_unit_reported"

  - name: rate_constant_unit_reported
    scope: experiment
    type: str
    max_length: 60
    description: >
      The rate constant's unit EXACTLY as printed in the paper (e.g.
      "h^-1", "L mol^-1 h^-1", "mol g_cat^-1 h^-1 bar^-1"). Do not
      normalize or convert -- record verbatim so unit harmonisation can be
      done deliberately downstream rather than guessed at extraction time.
    unit: "-"

  - name: reaction_order
    scope: experiment
    type: float
    description: >
      Fitted reaction order n if kinetic_model is power_law (or an
      apparent/pseudo order reported for pseudo_first_order /
      pseudo_second_order, which is 1.0 / 2.0 by definition of the model
      name -- still record it if the paper states it explicitly). Null if
      no order is reported.
    unit: "-"

  - name: pre_exponential_factor
    scope: experiment
    type: float
    description: >
      Arrhenius pre-exponential factor A, exactly as the paper reports the
      NUMBER (do not compute or convert). Null if no Arrhenius analysis
      is reported alongside activation_energy_kJ_mol.
    unit: "same basis as rate_constant"

  - name: pre_exponential_factor_is_log10
    scope: experiment
    type: bool
    description: >
      true if the value in pre_exponential_factor is log10(A) as printed
      (papers commonly report "ln A" or "log A" instead of A itself,
      since A is often 10-20 orders of magnitude and unwieldy to print
      directly -- e.g. "ln A = 13.2" or "log10(A) = 5.7"). false if the
      paper prints A directly (e.g. "A = 2.3 x 10^13"). This distinction
      is NOT cosmetic: treating a log-scale value as the raw factor (or
      vice versa) corrupts any downstream Arrhenius-based feature by many
      orders of magnitude. If the paper uses natural log (ln A) rather
      than log10, still set this true and note the ln-vs-log10 distinction
      in this experiment's evidence_text -- the boolean's job is only to
      flag "this number is on a log scale", not which log base.
    unit: boolean

  - name: coke_amount_wt_pct
    scope: experiment
    type: float
    description: Coke deposited on catalyst after reaction (from TGA)
    unit: "wt%"

  - name: structure_property_summary
    scope: experiment
    type: str
    max_length: 400
    description: >
      A single 1-3 sentence synthesis, IN YOUR OWN WORDS, of how THIS
      experiment's catalyst structure relates to its performance outcome
      -- e.g. "NiMo/SAPO-11 with 15 wt% loading and predominantly Bronsted
      acid sites (0.42 mmol/g NH3 uptake) gave 92% jet-range selectivity
      at 350C, consistent with strong hydroisomerization activity from
      the bifunctional acid/metal sites." Ground this ONLY in values
      already captured elsewhere in this SAME experiment record (active_
      metal, support_type, characterization fields, reaction conditions,
      performance fields) -- do not introduce a number, mechanism, or
      claim that isn't already one of this experiment's own extracted
      fields or directly stated in the source text for this experiment.
      Paraphrase; do not quote a sentence from the paper verbatim. This
      field exists so each experiment record is independently useful as a
      retrievable text passage (for RAG / semantic search) without
      needing the full paper's context, and as a same-record sanity check
      that connects the numeric fields into their intended causal story.
    unit: "-"

  - name: freezing_point_C
    scope: experiment
    type: float
    description: Freezing point of the finished SPK/jet fraction
    unit: "°C"

  - name: density_15C_kg_m3
    scope: experiment
    type: float
    description: Density at 15°C
    unit: "kg/m³"

  - name: kinematic_viscosity_neg20C_mm2_s
    scope: experiment
    type: float
    description: Kinematic viscosity at -20°C
    unit: "mm²/s"

  - name: flash_point_C
    scope: experiment
    type: float
    description: Flash point
    unit: "°C"

  - name: net_heat_of_combustion_MJ_kg
    scope: experiment
    type: float
    description: Net heat of combustion / specific energy
    unit: "MJ/kg"

  - name: astm_reference_standard
    scope: experiment
    type: str
    description: >
      SAF standard the paper explicitly benchmarks against. Only set if the
      paper cites the standard by name — do not infer from "SAF" or "jet fuel".
    unit: categorical
    enum: [ASTM_D7566_AnnexA2_HEFA_SPK, ASTM_D7566_AnnexA7_HC_HEFA_SPK,
           ASTM_D1655_conventional_jet, EN_16709, none_reported, other]

binary_targets:
  # ASTM D7566 Annex A2 (HEFA-SPK) limits — verify against your target edition
  - name: meets_freezing_point_spec
    field: freezing_point_C
    op: "<="
    value: -40.0
    description: "Freezing point <= -40°C (ASTM D7566 Annex A2)"

  - name: meets_density_spec
    field: density_15C_kg_m3
    op: "<="
    value: 772.0
    description: "Density at 15°C <= 772 kg/m³ (ASTM D7566 Annex A2 SBC limit)"

  - name: meets_viscosity_spec
    field: kinematic_viscosity_neg20C_mm2_s
    op: "<="
    value: 8.0
    description: "Kinematic viscosity at -20°C <= 8.0 mm²/s (ASTM D7566 Annex A2)"

  - name: meets_flash_point_spec
    field: flash_point_C
    op: ">="
    value: 38.0
    description: "Flash point >= 38°C (ASTM D7566/D1655 minimum)"

  - name: meets_combustion_spec
    field: net_heat_of_combustion_MJ_kg
    op: ">="
    value: 42.8
    description: "Net heat of combustion >= 42.8 MJ/kg (ASTM D7566/D1655 minimum)"

  - name: high_jet_range_selectivity
    field: c8_c16_jet_range_selectivity_pct
    op: ">="
    value: 70.0
    description: "C8-C16 selectivity >= 70%"

  - name: high_conversion
    field: oil_conversion_pct
    op: ">="
    value: 95.0
    description: "Feedstock conversion >= 95%"
