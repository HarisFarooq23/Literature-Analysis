[project]
name = "llm-extract"
version = "0.1.0"
description = "LLM-based structured extraction layer that consumes scientific-pdf-pipeline output and produces a clean dataset for downstream ML/optimization packages."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "ollama>=0.3.0",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "tenacity>=8.2",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "numpy>=1.24",
    "scipy>=1.11",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12"]

[project.scripts]
llm-extract = "llm_extract.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_extract*"]
